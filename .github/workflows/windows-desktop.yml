name: Windows x64 desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build, install and verify Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      NODE_VERSION: '24.10.0'

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate version tag
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与应用版本 v$version 不一致。"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run deterministic quality gates
        run: npm run ui:check && npm run ui:quality && npm run typecheck && npm test

      - name: Import optional Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/g4/import-windows-signing-certificate.ps1

      - name: Verify the MSI VBScript prerequisite
        shell: pwsh
        run: |
          $cscript = Get-Command 'cscript.exe' -ErrorAction SilentlyContinue
          if (-not $cscript) {
            throw '当前 Windows runner 没有可用的 VBScript 引擎，无法运行 WiX MSI 校验。'
          }
          $smokeScript = Join-Path $env:RUNNER_TEMP 'bibudai-vbscript-smoke.vbs'
          Set-Content -LiteralPath $smokeScript -Value 'WScript.Quit 0' -Encoding ascii
          & $cscript.Source //NoLogo $smokeScript
          if ($LASTEXITCODE -ne 0) {
            throw "VBScript 引擎烟测失败，退出码：$LASTEXITCODE"
          }
          Remove-Item -LiteralPath $smokeScript -Force
          Write-Output "VBScript engine: $($cscript.Source)"

      - name: Build NSIS and MSI installers
        run: npm run desktop:build:windows-ci

      - name: Collect installers and verify hashes/signatures
        shell: pwsh
        run: |
          $requireSigned = $env:BBD_WINDOWS_SIGNING_ENABLED -eq '1'
          ./scripts/g4/windows-ci-package.ps1 -RequireSigned $requireSigned

      - name: Smoke-test MSI install and uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath 'release/windows' -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw '没有找到待烟测的 MSI。' }
          ./scripts/g4/windows-installer-smoke.ps1 -InstallerPath $msi.FullName

      - name: Upload testable Windows package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bibudai-${{ steps.metadata.outputs.version }}-windows-x64-${{ github.run_number }}
          path: release/windows/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bibudai-${{ steps.metadata.outputs.version || 'unknown' }}-windows-x64-failed-${{ github.run_number }}
          path: release/windows/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Remove imported certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
